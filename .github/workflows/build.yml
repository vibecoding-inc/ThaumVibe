name: Build Artifacts

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-forge-mod:
    name: Build Forge Mod
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      
      - name: Upload Forge Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: thaumvibe-forge-mod
          path: build/libs/*.jar
          if-no-files-found: error
  
  build-mcp-server:
    name: Build MCP Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build MCP Server
        run: npm run build
      
      - name: Upload MCP Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thaumvibe-mcp-server
          path: |
            dist/
            package.json
            README.md
            MCP_SERVER.md
            MCP_EXAMPLES.md
          if-no-files-found: error
